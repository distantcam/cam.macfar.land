name: Eleventy Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: npm run build
        env:
          UNSPLASH_ACCESS: ${{ secrets.UNSPLASH_ACCESS }}
          UNSPLASH_SECRET: ${{ secrets.UNSPLASH_SECRET }}
